<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Chutku + Chintu ❤️</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Stars -->
  <div class="stars">
    <span></span><span></span><span></span><span></span><span></span>
    <span></span><span></span><span></span><span></span><span></span>
    <span></span><span></span><span></span><span></span><span></span>
    <span></span><span></span><span></span><span></span><span></span>
  </div>

  <!-- Teddy bears -->
  <img src="assets/images/teddy.png" class="teddy teddy-top-left" alt="Teddy">
  <img src="assets/images/teddy.png" class="teddy teddy-top-right" alt="Teddy">
  <img src="assets/images/teddy.png" class="teddy teddy-bottom-left" alt="Teddy">
  <img src="assets/images/teddy.png" class="teddy teddy-bottom-right" alt="Teddy">
  <img src="assets/images/teddy.png" class="teddy teddy-center" alt="Teddy">

  <!-- LOGIN PAGE -->
  <section id="loginPage" class="page active">
    <div class="login-card">

      <div class="big-smile">😊</div>

      <h1>Chutku + Chintu</h1>

      <div class="love-line">💖 ✨ ⭐ ✨ 💖</div>

      <p class="subtitle">
        A little secret world made only for us
      </p>

      <div class="input-group">
        <label>Login ID</label>
        <input
          id="loginId"
          type="text"
          placeholder="CHINTU"
        >
      </div>

      <div class="input-group">
        <label>Password</label>
        <input
          id="loginPass"
          type="password"
          placeholder="I LOVE YOU"
        >
      </div>

      <button id="loginBtn" class="primary-btn">
        Open Our World 💖
      </button>

      <p id="loginError" class="login-error"></p>

    </div>
  </section>

  <!-- LOVE LETTER PAGE -->
  <section id="letterPage" class="page">

    <!-- Flowers -->
    <div class="flower-rain-container">
      <img src="assets/images/ROSE.png" class="flower-rain f1">
      <img src="assets/images/ROSE.png" class="flower-rain f2">
      <img src="assets/images/ROSE.png" class="flower-rain f3">
      <img src="assets/images/ROSE.png" class="flower-rain f4">
      <img src="assets/images/ROSE.png" class="flower-rain f5">
      <img src="assets/images/ROSE.png" class="flower-rain f6">
      <img src="assets/images/ROSE.png" class="flower-rain f7">
      <img src="assets/images/ROSE.png" class="flower-rain f8">
    </div>

    <div class="letter-card">

      <div class="letter-head">💌 FOR MY LOVE 💌</div>

      <h2>To My Chutku</h2>

      <p>
        Every star in this sky reminds me of you.
        Every flower carries a little piece of my heart.
        If this letter could speak, it would only whisper one thing...
      </p>

      <h3>I Love You ❤️</h3>

      <button id="continueBtn" class="primary-btn">
        Continue 🌹
      </button>

    </div>

  </section>

  <!-- Music -->
  <audio id="bgMusic" loop preload="auto">
    <source src="assets/audio/love.mp3" type="audio/mpeg">
  </audio>

  <script src="js/app.js"></script>

</body>
</html>
